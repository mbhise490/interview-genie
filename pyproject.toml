[project]
name = "interview-genie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=3.14.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.3",
    "pyodbc>=5.3.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.14.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "streamlit>=1.40.0",
    "requests>=2.32.0",
]

[project.scripts]
interview-genie = "interview_genie:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
