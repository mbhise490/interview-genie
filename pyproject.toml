authors = [
    { name = "mbhise490", email = "mbhise490@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "langgraph>=1.2.15",
    "loadenv>=0.1.1",
    "openai>=3.29.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
